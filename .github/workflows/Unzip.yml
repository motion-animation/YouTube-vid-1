name: Bulk Extract ZIPs

on:
  workflow_dispatch:
    inputs:
      zip_pattern:
        description: 'ZIP pattern (default: *.zip). Example: *.zip, data-*.zip'
        required: false
        default: '*.zip'
        type: string

permissions:
  contents: write   # GITHUB_TOKEN ko push karne ki permission

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bulk extract ZIPs
        shell: bash
        env:
          PATTERN: ${{ github.event.inputs.zip_pattern }}
        run: |
          set -euo pipefail

          PATTERN="${PATTERN:-*.zip}"

          # Root me matching zip files collect karo (null-separated for safety)
          mapfile -d '' ZIPS < <(find . -maxdepth 1 -type f -name "$PATTERN" -print0)

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "⚠️ Root me '$PATTERN' se koi ZIP nahi mila."
            exit 0
          fi

          echo "📦 Total ZIPs mile: ${#ZIPS[@]}"
          printf '   - %s\n' "${ZIPS[@]}"

          EXTRACTED=0
          FAILED=()

          for ZIP in "${ZIPS[@]}"; do
            BASE="$(basename "$ZIP")"
            FOLDER="${BASE%.zip}"

            # Safety: folder name empty na ho (jaise ".zip" file)
            if [ -z "$FOLDER" ] || [ "$FOLDER" = "$BASE" ]; then
              echo "❌ Skip (bad name): $BASE"
              FAILED+=("$BASE")
              continue
            fi

            # Folder pehle se exist karta ho to skip (overwrite nahi)
            if [ -e "$FOLDER" ]; then
              echo "⏭️  Skip '$BASE' — folder '$FOLDER' already exists."
              continue
            fi

            echo "🔧 Extracting: $BASE -> $FOLDER/"
            mkdir -p "$FOLDER"
            if unzip -q -o "$ZIP" -d "$FOLDER"; then
              rm -f "$ZIP"
              EXTRACTED=$((EXTRACTED + 1))
              echo "   ✅ Done, ZIP removed."
            else
              echo "   ❌ unzip fail hua: $BASE"
              FAILED+=("$BASE")
              # half-extracted folder clean karo
              rm -rf "$FOLDER"
            fi
          done

          echo "──────────────────────────────"
          echo "✅ Extracted: $EXTRACTED"
          echo "❌ Failed   : ${#FAILED[@]}"
          if [ "${#FAILED[@]}" -gt 0 ]; then
            printf '   - %s\n' "${FAILED[@]}"
            exit 1
          fi

      - name: Commit and push
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ Koi change nahi, commit skip."
            exit 0
          fi
          git commit -m "chore: bulk extract zips into folders [skip ci]"
          git push
