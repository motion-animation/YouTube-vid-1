name: Render Tape Market 1080p Video

on:
  workflow_dispatch:
    inputs:
      gdrive_audio_url:
        description: "Google Drive share link (or File ID) for your voiceover audio (Anyone with the link)"
        required: false
        default: ""
  push:
    branches:
      - main
      - master

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Render 1080p Video (Parallel Chunks + SFX + Google Drive Audio)
        env:
          GDRIVE_AUDIO_URL: ${{ github.event.inputs.gdrive_audio_url || secrets.GDRIVE_AUDIO_URL }}
        run: |
          python render.py --fps 25 --workers 4 --output output_1080p.mp4

      - name: Upload Rendered 1080p Video
        uses: actions/upload-artifact@v4
        with:
          name: tape-market-1080p-video
          path: output_1080p.mp4
          retention-days: 14
