name: Merge Zip Into Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Extract & merge zip into repo, then delete zip
        env:
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          python3 - << 'EOF'
          import glob, os, shutil, zipfile

          zips = sorted(glob.glob("*.zip"))
          if not zips:
              raise SystemExit("ERROR: Repo root me koi .zip file nahi mili!")

          zip_path = zips[0]
          print(f"Found zip: {zip_path}")
          has_pat = os.environ.get("HAS_PAT", "false").lower() == "true"

          with zipfile.ZipFile(zip_path, "r") as zf:
              for member in zf.infolist():
                  if member.is_dir():
                      continue
                  if not has_pat and member.filename.startswith(".github/workflows/"):
                      print(f"Skipping {member.filename} (set GH_PAT secret to update workflows)")
                      continue
                  target = os.path.normpath(member.filename)
                  if target.startswith(".."):
                      continue
                  parent = os.path.dirname(target)
                  if parent:
                      os.makedirs(parent, exist_ok=True)
                  with zf.open(member) as src, open(target, "wb") as dst:
                      shutil.copyfileobj(src, dst)

          os.remove(zip_path)
          print("Merged zip into repo & deleted zip!")
          EOF

      - name: Commit and push merged files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: merge extracted zip into repo"
            git push
          fi
