name: Unpack Zip & Clean Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Clean repo, extract any zip, and delete zip
        env:
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          python3 - << 'EOF'
          import glob, os, shutil, zipfile

          zips = sorted(glob.glob("*.zip"))
          if not zips:
              raise SystemExit("ERROR: Repo root me koi .zip file nahi mili!")

          zip_path = zips[0]
          print(f"Found zip: {zip_path}")

          has_pat = os.environ.get("HAS_PAT", "false").lower() == "true"

          # Delete everything in root except .git, .github, and the zip file
          for item in os.listdir("."):
              if item in (".git", ".github", zip_path):
                  continue
              if os.path.isdir(item):
                  shutil.rmtree(item)
              else:
                  os.remove(item)

          # Extract zip
          with zipfile.ZipFile(zip_path, "r") as zf:
              for member in zf.infolist():
                  if member.is_dir():
                      continue
                  # Skip .github/workflows/* if GH_PAT is not set (GitHub blocks GITHUB_TOKEN workflow pushes)
                  if not has_pat and member.filename.startswith(".github/workflows/"):
                      print(f"Skipping {member.filename} (set GH_PAT secret to update workflows)")
                      continue
                  target = os.path.normpath(member.filename)
                  if target.startswith(".."):
                      continue
                  parent = os.path.dirname(target)
                  if parent:
                      os.makedirs(parent, exist_ok=True)
                  with zf.open(member) as src, open(target, "wb") as dst:
                      shutil.copyfileobj(src, dst)

          # Auto-delete zip
          os.remove(zip_path)
          print("Unpack complete & zip deleted!")
          EOF

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: unpack zip and clean repo"
            git push
          fi
